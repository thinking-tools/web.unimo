<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}

.wp-macos{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 20%,#0f3460 40%,#533483 60%,#e94560 80%,#f5a623 100%)}
.wp-windows{background:linear-gradient(135deg,#000428 0%,#004e92 35%,#00b4db 55%,#0083b0 75%,#001f54 100%)}
.wp-linux{background:linear-gradient(135deg,#2c001e 0%,#5e2750 25%,#e95420 60%,#f2994a 80%,#77216f 100%)}
.wp-ios{background:linear-gradient(145deg,#1c1c3a 0%,#3a1c71 20%,#d76d77 50%,#ffaf7b 75%,#f7c59f 100%)}
.wp-android{background:linear-gradient(135deg,#0d1b2a 0%,#1b263b 20%,#415a77 40%,#778da9 60%,#e0e1dd 90%)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;contain:layout style}

.status-bar{display:none;height:env(safe-area-inset-top,44px);min-height:44px;padding:12px 24px 0;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;z-index:100;flex-shrink:0}
.status-bar .time{flex:1}
.status-bar .notch{flex:1;display:flex;justify-content:center}
.status-bar .notch-shape{width:120px;height:28px;background:#000;border-radius:0 0 18px 18px}
.status-bar .indicators{flex:1;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.mobile .status-bar{display:flex}

.menu-bar{display:none;height:28px;padding:0 12px;align-items:center;font-size:13px;font-weight:500;gap:16px;background:rgba(0,0,0,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:100;flex-shrink:0}
.menu-bar .right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px}
.desktop .menu-bar{display:flex}

.app-grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;contain:layout style}

.desktop .app-grid{display:grid;grid-template-columns:repeat(7,88px);gap:28px 36px;justify-content:center;align-content:center}
.desktop .app-icon-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:default}
.desktop .app-icon{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);position:relative}
.desktop .app-icon svg{width:34px;height:34px;fill:white}
.desktop .app-label{font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mobile .app-grid{display:grid;grid-template-columns:repeat(4,72px);gap:22px 20px;justify-content:center;align-content:start;padding-top:10px}
.mobile .app-icon-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.mobile .app-icon{width:60px;height:60px;border-radius:13.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);position:relative}
.mobile .app-icon svg{width:30px;height:30px;fill:white}
.mobile .app-label{font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.5);text-align:center;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;background:#ff3b30;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid rgba(0,0,0,.15);z-index:2;animation:badgePop .4s cubic-bezier(.34,1.8,.64,1) forwards;box-shadow:0 0 8px rgba(255,59,48,.6)}
.badge.pulse{animation:badgePop .4s cubic-bezier(.34,1.8,.64,1),badgePulse 1.5s ease-in-out .4s infinite}
@keyframes badgePop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes badgePulse{0%,100%{transform:scale(1);box-shadow:0 0 8px rgba(255,59,48,.6)}50%{transform:scale(1.15);box-shadow:0 0 14px rgba(255,59,48,.9)}}

.dock{display:none;padding:8px 0 calc(env(safe-area-inset-bottom,8px) + 8px);flex-shrink:0}
.mobile .dock{display:flex;justify-content:center}
.dock-inner{display:flex;gap:18px;padding:8px 16px;background:rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px}
.dock .app-icon{width:56px;height:56px;border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.dock .app-icon svg{width:28px;height:28px;fill:white}

.desktop-dock{display:none;padding-bottom:6px;flex-shrink:0}
.desktop .desktop-dock{display:flex;justify-content:center}
.desktop-dock .dock-inner{gap:4px;padding:4px 8px;border-radius:16px;background:rgba(255,255,255,.1);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.desktop-dock .app-icon{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:transform .15s;cursor:default}
.desktop-dock .app-icon:hover{transform:scale(1.2) translateY(-6px)}
.desktop-dock .app-icon svg{width:26px;height:26px;fill:white}
.dock-sep{width:1px;background:rgba(255,255,255,.2);margin:4px 2px}

.notif-container{position:fixed;z-index:1000;pointer-events:none;contain:layout style}
.mobile .notif-container{top:50px;left:6px;right:6px}
.desktop .notif-container{top:36px;right:12px;width:380px;max-width:calc(100vw - 24px)}
.notif{background:rgba(30,30,30,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;pointer-events:auto;margin-bottom:8px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:notifIn .45s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0;transform:translateY(-30px);will-change:transform,opacity;contain:layout style}
.notif.out{animation:notifOut .35s ease-in forwards}
.notif-icon{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-icon svg{width:20px;height:20px;fill:white}
.notif-body{flex:1;min-width:0}
.notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.notif-app{font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.notif-time{font-size:12px;color:rgba(255,255,255,.4)}
.notif-text{font-size:15px;font-weight:500;color:#fff;line-height:1.35}

@keyframes notifIn{0%{opacity:0;transform:translateY(-30px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes notifOut{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(.95)}}
@keyframes screenShake{0%,100%{transform:translate(0)}10%{transform:translate(-2px,1px)}30%{transform:translate(2px,-1px)}50%{transform:translate(-1px,2px)}70%{transform:translate(1px,-2px)}90%{transform:translate(-1px,1px)}}
.screen.shake{animation:screenShake .3s ease}
.anxiety-vignette{position:fixed;inset:0;pointer-events:none;z-index:500;opacity:0;transition:opacity 2s ease;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.15) 100%)}
.anxiety-vignette.active{opacity:1}

.search-bar{display:none;justify-content:center;padding:16px 0 8px;flex-shrink:0}
.desktop .search-bar{display:flex}
.search-inner{width:260px;height:34px;border-radius:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:rgba(255,255,255,.5)}
.search-inner svg{width:14px;height:14px;fill:rgba(255,255,255,.5)}

.page-dots{display:none;justify-content:center;gap:6px;padding:8px 0}
.mobile .page-dots{display:flex}
.page-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.page-dot.active{background:rgba(255,255,255,.85)}

/* Narrow desktops / landscape tablets */
@media(max-width:900px){
.desktop .app-grid{grid-template-columns:repeat(6,80px);gap:24px 28px}
.desktop .app-icon{width:58px;height:58px;border-radius:13px}
.desktop .app-icon svg{width:30px;height:30px}
.desktop-dock .app-icon{width:42px;height:42px}
.desktop-dock .app-icon svg{width:22px;height:22px}
}
@media(max-width:700px){
.desktop .app-grid{grid-template-columns:repeat(5,72px);gap:20px 22px}
.desktop .app-icon{width:52px;height:52px;border-radius:12px}
.desktop .app-icon svg{width:26px;height:26px}
.desktop .app-label{font-size:10px}
.desktop .notif-container{width:300px}
}
/* Small phones (SE, 5s, etc.) */
@media(max-width:374px){
.mobile .app-grid{grid-template-columns:repeat(4,58px);gap:18px 14px}
.mobile .app-icon{width:50px;height:50px;border-radius:11px}
.mobile .app-icon svg{width:26px;height:26px}
.mobile .app-label{font-size:10px;max-width:56px}
.dock-inner{gap:14px;padding:6px 12px}
.dock .app-icon{width:48px;height:48px;border-radius:11px}
.dock .app-icon svg{width:24px;height:24px}
.notif{padding:10px 12px;gap:10px;border-radius:14px}
.notif-icon{width:32px;height:32px;border-radius:7px}
.notif-icon svg{width:16px;height:16px}
.notif-text{font-size:13px}
.notif-app{font-size:12px}
.badge{min-width:18px;height:18px;font-size:10px;border-radius:9px}
}
/* Tall phones - more rows visible */
@media(max-height:600px) and (max-width:820px){
.mobile .app-grid{gap:14px 16px}
.mobile .app-icon{width:48px;height:48px}
.mobile .app-icon svg{width:24px;height:24px}
.status-bar{min-height:32px;padding:6px 16px 0}
}

/* Hero CTA overlay */
.hero-overlay{position:fixed;inset:0;z-index:2000;background:#0c0c0c;display:flex;align-items:center;justify-content:center;padding:8vw 10vw;opacity:0;pointer-events:none;transition:opacity 1.8s ease;contain:layout style paint}
.hero-overlay.active{opacity:1;pointer-events:auto}
.hero-content{max-width:720px}
.hero-headline{font-size:clamp(28px,5.5vw,64px);font-weight:700;line-height:1.15;letter-spacing:-.02em;color:#e8e8ec;margin-bottom:32px;opacity:0;transform:translateY(30px);transition:opacity 1s ease .4s,transform 1s ease .4s}
.hero-sub{font-size:clamp(15px,2vw,22px);font-weight:400;line-height:1.5;color:rgba(232,232,236,.5);margin-bottom:48px;max-width:520px;opacity:0;transform:translateY(20px);transition:opacity 1s ease .9s,transform 1s ease .9s}
.hero-btn{display:inline-block;padding:16px 36px;font-size:clamp(15px,1.8vw,18px);font-weight:600;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;cursor:pointer;text-decoration:none;opacity:0;transform:translateY(20px);transition:opacity 1s ease 1.4s,transform 1s ease 1.4s,box-shadow .2s;box-shadow:0 4px 24px rgba(99,102,241,.4);font-family:inherit}
.hero-btn:hover{box-shadow:0 6px 32px rgba(99,102,241,.6)}
.hero-overlay.active .hero-headline,.hero-overlay.active .hero-sub,.hero-overlay.active .hero-btn{opacity:1;transform:translateY(0)}
@media(max-width:600px){
.hero-overlay{padding:10vw 8vw}
.hero-headline{margin-bottom:24px}
.hero-sub{margin-bottom:36px}
.hero-btn{padding:14px 28px;border-radius:10px;width:100%;text-align:center}
}

@media(prefers-reduced-motion:reduce){
.notif{animation:none!important;opacity:1;transform:none}
.notif.out{animation:none!important;opacity:0}
.desktop .app-icon:hover,.desktop-dock .app-icon:hover{transform:none}
.screen.shake{animation:none!important}
}
</style>

<script>
(()=>{

const detect=()=>{

if(/iPhone|iPod/.test(ua)||(/iPad/.test(ua)&&navigator.maxTouchPoints>1))os='ios';
else if(/Android/i.test(ua))os='android';

else if(/Linux/i.test(p)&&!/Android/i.test(ua))os='linux';

const raw=navigator.language||navigator.languages?.[0]||'en';

return{os,mobile,lang};

const T={
en:["We are stuck in this.","Is this the best design we deserve?","Same grid of icons since 2007.","Your apps don\u2019t talk to each other.","Your data is scattered across dozens of silos.","What if there was a better way?"],

de:["Wir stecken hier fest.","Ist das das beste Design, das wir verdienen?","Dasselbe Icon-Raster seit 2007.","Deine Apps reden nicht miteinander.","Deine Daten sind \u00fcber Dutzende Silos verstreut.","Was w\u00e4re, wenn es einen besseren Weg g\u00e4be?"],
pt:["Estamos presos nisso.","\u00c9 este o melhor design que merecemos?","A mesma grade de \u00edcones desde 2007.","Seus apps n\u00e3o conversam entre si.","Seus dados est\u00e3o espalhados em dezenas de silos.","E se houvesse um jeito melhor?"],
ru:["\u041c\u044b \u0437\u0430\u0441\u0442\u0440\u044f\u043b\u0438 \u0432 \u044d\u0442\u043e\u043c.","\u042d\u0442\u043e \u043b\u0443\u0447\u0448\u0438\u0439 \u0434\u0438\u0437\u0430\u0439\u043d, \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u043c\u044b \u0437\u0430\u0441\u043b\u0443\u0436\u0438\u0432\u0430\u0435\u043c?","\u0422\u0430 \u0436\u0435 \u0441\u0435\u0442\u043a\u0430 \u0438\u043a\u043e\u043d\u043e\u043a \u0441 2007 \u0433\u043e\u0434\u0430.","\u0412\u0430\u0448\u0438 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u044f \u043d\u0435 \u043e\u0431\u0449\u0430\u044e\u0442\u0441\u044f \u0434\u0440\u0443\u0433 \u0441 \u0434\u0440\u0443\u0433\u043e\u043c.","\u0412\u0430\u0448\u0438 \u0434\u0430\u043d\u043d\u044b\u0435 \u0440\u0430\u0437\u0431\u0440\u043e\u0441\u0430\u043d\u044b \u043f\u043e \u0434\u0435\u0441\u044f\u0442\u043a\u0430\u043c \u0445\u0440\u0430\u043d\u0438\u043b\u0438\u0449.","\u0410 \u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c \u0441\u043f\u043e\u0441\u043e\u0431 \u043b\u0443\u0447\u0448\u0435?"],
zh:["\u6211\u4eec\u88ab\u56f0\u5728\u4e86\u8fd9\u91cc\u3002","\u8fd9\u662f\u6211\u4eec\u5e94\u5f97\u7684\u6700\u597d\u8bbe\u8ba1\u5417\uff1f","\u4ece2007\u5e74\u8d77\u5c31\u662f\u540c\u6837\u7684\u56fe\u6807\u7f51\u683c\u3002","\u4f60\u7684\u5e94\u7528\u4e4b\u95f4\u4e92\u4e0d\u901a\u4fe1\u3002","\u4f60\u7684\u6570\u636e\u5206\u6563\u5728\u6570\u5341\u4e2a\u5b64\u5c9b\u4e2d\u3002","\u5982\u679c\u6709\u66f4\u597d\u7684\u65b9\u6cd5\u5462\uff1f"],
ja:["\u79c1\u305f\u3061\u306f\u3053\u3053\u306b\u56da\u308f\u308c\u3066\u3044\u308b\u3002","\u3053\u308c\u304c\u79c1\u305f\u3061\u306b\u3075\u3055\u308f\u3057\u3044\u6700\u9ad8\u306e\u30c7\u30b6\u30a4\u30f3\uff1f","2007\u5e74\u304b\u3089\u540c\u3058\u30a2\u30a4\u30b3\u30f3\u306e\u30b0\u30ea\u30c3\u30c9\u3002","\u30a2\u30d7\u30ea\u540c\u58eb\u304c\u4f1a\u8a71\u3057\u3066\u3044\u306a\u3044\u3002","\u30c7\u30fc\u30bf\u304c\u6570\u5341\u306e\u30b5\u30a4\u30ed\u306b\u6563\u3089\u3070\u3063\u3066\u3044\u308b\u3002","\u3082\u3063\u3068\u826f\u3044\u65b9\u6cd5\u304c\u3042\u308b\u3068\u3057\u305f\u3089\uff1f"],
ko:["\uc6b0\ub9ac\ub294 \uc5ec\uae30\uc5d0 \uac07\ud600 \uc788\ub2e4.","\uc774\uac8c \uc6b0\ub9ac\uac00 \ubc1b\uc744 \uc790\uaca9\uc774 \uc788\ub294 \ucd5c\uace0\uc758 \ub514\uc790\uc778\uc778\uac00?","2007\ub144\ubd80\ud130 \uac19\uc740 \uc544\uc774\ucf58 \uadf8\ub9ac\ub4dc.","\ub2f9\uc2e0\uc758 \uc571\ub4e4\uc740 \uc11c\ub85c \ub300\ud654\ud558\uc9c0 \uc54a\ub294\ub2e4.","\ub370\uc774\ud130\uac00 \uc218\uc2ed \uac1c\uc758 \uc0ac\uc77c\ub85c\uc5d0 \ud769\uc5b4\uc838 \uc788\ub2e4.","\ub354 \ub098\uc740 \ubc29\ubc95\uc774 \uc788\ub2e4\uba74?"],

const pad=n=>String(n).padStart(2,'0');
const timeStr=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e};

let allIcons=[];
const fmtBadge=v=>v>999?Math.round(v/1000)+'k+':String(v);
const buildIcon=(app,withBadge,idx)=>{
const wrap=el('div','app-icon-wrap');
const icon=el('div','app-icon');
icon.style.background=app.bg;
icon.innerHTML=I[app.id]||I.browser;
if(withBadge&&app.badge){
const b=el('div','badge'+(app.badge>20?' pulse':''),fmtBadge(app.badge));
icon.appendChild(b);
}
icon.dataset.appIdx=idx;
wrap.appendChild(icon);
wrap.appendChild(el('span','app-label',app.label));
allIcons.push(icon);
return wrap;
};

const buildGrid=mobile=>{
const grid=el('div','app-grid');
allIcons=[];
apps.slice(0,mobile?20:24).forEach((a,i)=>grid.appendChild(buildIcon(a,true,i)));
return grid;
};

const buildDock=()=>{
const dock=el('div','dock');
const inner=el('div','dock-inner');
dockApps.forEach(id=>{const a=apps.find(x=>x.id===id);if(!a)return;const ic=el('div','app-icon');ic.style.background=a.bg;ic.innerHTML=I[a.id];inner.appendChild(ic)});
dock.appendChild(inner);return dock;
};

const buildDesktopDock=()=>{
const dock=el('div','desktop-dock');
const inner=el('div','dock-inner');
desktopDockApps.forEach((id,i)=>{const a=apps.find(x=>x.id===id);if(!a)return;const ic=el('div','app-icon');ic.style.background=a.bg;ic.innerHTML=I[a.id];inner.appendChild(ic);if(i===3)inner.appendChild(el('div','dock-sep'))});
dock.appendChild(inner);return dock;
};

const getSpam=lang=>(spamTexts[lang]||spamTexts.en);

const showNotif=(text,appInfo)=>{
const fa=appInfo||{name:'Unimo',bg:'linear-gradient(135deg,#6366f1,#8b5cf6)',svg:null};
const iconHtml=fa.svg?I[fa.svg]||unimoSvg:unimoSvg;
const iconBg=fa.bg;
const n=el('div','notif',`<div class="notif-icon" style="background:${iconBg}">${iconHtml}</div><div class="notif-body"><div class="notif-header"><span class="notif-app">${fa.name}</span><span class="notif-time">now</span></div><div class="notif-text">${text}</div></div>`);
if(nc.children.length>=6){const o=nc.firstElementChild;if(o)dismiss(o)}
nc.appendChild(n);
// shake screen on every 3rd notification
if(nc.children.length%3===0){
const root=document.getElementById('root');
root.classList.add('shake');
setTimeout(()=>root.classList.remove('shake'),300);
}
setTimeout(()=>dismiss(n),6000);
};

const dismiss=n=>{
if(!n?.parentNode)return;
n.classList.add('out');
const rm=()=>{if(n.parentNode)n.remove()};
n.addEventListener('animationend',rm,{once:true});
setTimeout(rm,400);
};

const getHero=lang=>heroL10n[lang]||heroL10n.en;

// Hero overlay element
const hero=el('div','hero-overlay');
const hl=getHero(lang);
hero.innerHTML=`<div class="hero-content"><h1 class="hero-headline">${hl.h}</h1><p class="hero-sub">${hl.s}</p><a class="hero-btn" href="https://cryptpad.cz/form/#/2/form/view/AFFelSJl-3PlekPX2HlFIw4hnW0kToTcIHHDkV6xy9Y/">${hl.b}</a></div>`;
root.appendChild(hero);

// Transition: fade to hero on interaction or timeout
let transitioned=false;
const timers=[];
const triggerHero=()=>{
if(transitioned)return;
transitioned=true;
timers.forEach(clearTimeout);
hero.classList.add('active');
};
const autoTimer=setTimeout(triggerHero,10000);
timers.push(autoTimer);
const evts=['click','touchstart','wheel','scroll','keydown'];
const handler=()=>{if(!transitioned){triggerHero();evts.forEach(e=>window.removeEventListener(e,handler))}};
evts.forEach(e=>window.addEventListener(e,handler,{passive:true}));

const msgs=getMessages(lang);
const spam=getSpam(lang);

// Phase 1: Unimo philosophical notifications (first 20s)
const unimoDelays=[2000,6500,12000,18000,26000,35000];
msgs.forEach((m,i)=>{const t=setTimeout(()=>showNotif(m),unimoDelays[i]||(35000+(i-5)*7000));timers.push(t)});

// Phase 2: Spam notifications from fake apps start at 4s, accelerate
let spamIdx=0;
let spamInterval=3500;
const spamTick=()=>{
if(transitioned)return;
const fa=fakeApps[(Math.random()*fakeApps.length)|0];
const txt=spam[spamIdx%spam.length];
spamIdx++;
showNotif(txt,fa);
spamInterval=Math.max(1200,spamInterval-200);
const t=setTimeout(spamTick,spamInterval);timers.push(t);
};
timers.push(setTimeout(spamTick,4000));

// Badge anxiety: spawn new badges and grow existing ones aggressively
const spawnBadge=()=>{
if(!allIcons.length)return;
const pick=allIcons[(Math.random()*allIcons.length)|0];
const existing=pick.querySelector('.badge');
if(existing){
let v=parseInt(existing.textContent)||1;
const jump=((Math.random()*20)|0)+1;
v+=jump;
existing.textContent=fmtBadge(v);
existing.style.animation='none';
void existing.offsetWidth;
existing.style.animation='';
if(v>15)existing.classList.add('pulse');
}else{
const b=el('div','badge',String(((Math.random()*30)|0)+1));
pick.appendChild(b);
}
};
let bInterval=2000;
const bTick=()=>{
if(transitioned)return;
spawnBadge();
if(Math.random()>.6)spawnBadge();
bInterval=Math.max(400,bInterval-100);
const t=setTimeout(bTick,bInterval);timers.push(t);
};
timers.push(setTimeout(bTick,2500));

setInterval(()=>{
const t=timeStr();
const sb=root.querySelector('.status-bar .time');if(sb)sb.textContent=t;
const mb=root.querySelector('.menu-bar .right span');if(mb)mb.textContent=t;
},30000);
};
